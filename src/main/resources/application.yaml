spring:
  application:
    name: ex06

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
    defer-datasource-initialization: true

  datasource:
    url: jdbc:mysql://localhost:3306/springdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

